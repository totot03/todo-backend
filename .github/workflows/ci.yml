# ─────────────────────────────────────────────
# 백엔드 CI — 훅의 "최종 방어선"
#
# mvn verify 는 validate 단계에 묶인 Spotless check 를 자동으로 포함하므로
# 포맷 위반 · 컴파일 오류 · 테스트 실패가 한 번에 걸러진다.
# ─────────────────────────────────────────────
name: backend-ci

on:
  push:
    branches: [main, master, "feature/**", "fix/**", "dev/**", "hotfix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: 빌드 + 포맷 검사 + 테스트
        run: ./mvnw --batch-mode verify
