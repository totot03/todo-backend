# /etc/todolist/todolist.conf — JVM 런타임 옵션(비밀값 없음).
#
# install.sh가 최초 1회만 이 파일을 /etc/todolist/todolist.conf로 복사하며, 이미 파일이
# 존재하면 덮어쓰지 않는다(운영 중 수동으로 조정한 값을 보존하기 위함).
#
# t2.micro(vCPU 1개, RAM 1GB) 튜닝 근거:
#  -Xms256m -Xmx512m        힙을 512MB로 고정(요청사항). 나머지(~500MB)는 OS + 메타스페이스
#                            + 스레드 스택 등 네이티브 메모리에 할당된다.
#  -Xss512k                 스레드 스택 크기를 기본 1MB에서 축소해, 스레드(Tomcat NIO 워커 등)
#                            하나당 메모리 사용량을 절감한다.
#  -XX:+UseSerialGC         기본 GC(G1)는 CPU 코어 수에 비례해 백그라운드 GC 스레드를 여러 개
#                            띄우는데, vCPU 1개뿐인 t2.micro에서는 이 스레드 자체가 오버헤드다.
#                            힙이 작을 때는 SerialGC(단일 스레드)가 메모리·CPU 사용량이 더 낮다.
#  -XX:TieredStopAtLevel=1  C2 JIT를 비활성화(C1까지만 사용). 컴파일러 스레드/코드캐시 사용량이
#                            줄고 기동도 빨라진다. 트래픽이 적은 단일 인스턴스라 C2의 피크 처리량
#                            이득보다 메모리 절감이 더 중요하다는 판단.
#  -XX:+ExitOnOutOfMemoryError  OOM 발생 시 JVM을 즉시 종료시켜 systemd(Restart=on-failure)가
#                            재기동하도록 한다. 어중간하게 살아남아 응답 불가 상태로 방치되는
#                            것을 방지한다.
#  -Djava.security.egd=file:/dev/./urandom  SecureRandom(BCrypt 비밀번호 해시, JWT 서명)
#                            초기화 지연을 방지한다.
JAVA_OPTS="-Xms256m -Xmx512m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
