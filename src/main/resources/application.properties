spring.application.name=todo-backend

# --- Database (PostgreSQL / 스키마: TodoListDB) --- 
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=Todolist_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate --- 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=todolist_db
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug