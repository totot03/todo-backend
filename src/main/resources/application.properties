spring.application.name=todo-backend

# --- 프로필 ---
# 로컬 개발 기본값. application-local.properties(gitignore 처리됨)가 자동 로드된다.
# v1.1 AWS 배포 시 SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다 (ROADMAP.md 7장).
spring.profiles.active=local

# --- Database (PostgreSQL / 스키마: todolist_db) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=todolist_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JWT (M2-A) ---
# 시크릿 값은 application-local.properties(gitignore 처리됨)에서만 채운다. RISK-3(평문 비밀번호 유출)
# 재발 방지를 위해 이 파일에는 절대 실제 값을 적지 않는다.
jwt.secret=${JWT_SECRET}
# 24시간(ms). Access Token 전용, Refresh Token 없음(PRD.md §8 불변 규칙).
jwt.expiration=86400000

# --- OAuth2 (M2-B, 구글 로그인) ---
# client-id/secret 값은 application-local.properties(gitignore 처리됨)에서만 채운다. RISK-3 재발 방지를 위해
# 이 파일에는 절대 실제 값을 적지 않는다. scope는 email, profile만 요청한다(ROADMAP.md M2-B, 최소 권한 원칙).
# 사전 준비: 구글 클라우드 콘솔에서 OAuth 클라이언트를 만들고 리디렉션 URI로
# http://localhost:8080/login/oauth2/code/google 을 등록해야 한다 — 안 해두면 이 마일스톤에서 반드시 멈춘다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# 로그인 성공/실패 후 사용자를 돌려보낼 프론트엔드 경로. 핸들러 코드에 매직 스트링으로 박아두지 않기 위해 분리했다.
# 실패 시에는 원인을 구분하지 않고 항상 이 경로로만 보낸다(열거 공격 방지, CLAUDE.md 불변 규칙).
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth2/callback}
app.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/login?error=oauth}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=todolist_db
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# --- SQL 초기화 (schema.sql) ---
# users 부분 유니크 인덱스·todos 복합 인덱스는 ddl-auto 로 표현할 수 없어 schema.sql 로 별도 적용한다.
# defer-datasource-initialization=true 로 Hibernate 가 테이블을 먼저 만든 뒤 schema.sql 이 실행되도록 순서를 보장한다.
# postgres 같은 외부 DB는 기본적으로 spring.sql.init.mode 가 always 가 아니므로 명시적으로 켠다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- 파일 업로드 (M7) ---
# multipart 한도는 앱 한도(file.storage.max-size = 5MB)보다 일부러 크게 잡는다. 같은 값으로 두면
# 5MB 파일이 컨테이너 경계에서 먼저 잘려 우리 검증 코드에 도달조차 못 하고, 그러면
# FILE_TOO_LARGE 와 INVALID_FILE_TYPE 을 구분해 응답할 수 없다. 설정 자체가 없으면 Spring 기본값
# 1MB 가 걸리므로 5MB 파일은 아예 시도조차 못 한다. 한도를 넘겨 컨테이너가 요청을 끊는 경우는
# GlobalExceptionHandler 의 MaxUploadSizeExceededException 핸들러가 같은 봉투로 변환한다.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# 저장소 구현 선택: local(기본) 또는 s3. S3 구현은 v1.1 에서 붙인다(ROADMAP.md 7장).
# LocalFileStorageService 가 @ConditionalOnProperty(matchIfMissing=true) 로 이 값을 읽는다.
file.storage.type=${FILE_STORAGE_TYPE:local}
# 업로드 허용 최대 크기(바이트). 5MB = 5 * 1024 * 1024. 위 multipart 한도와 달리 DataSize 문자열이
# 아니라 정수다 — AttachmentService 가 직접 비교해 FILE_TOO_LARGE 를 던진다.
file.storage.max-size=5242880
# 로컬 저장 루트. 상대경로 ../upload 는 todo-backend 를 작업 디렉터리로 실행할 때만
# todo-project/upload 를 가리킨다. IDE 는 작업 디렉터리가 다를 수 있으므로
# LocalFileStorageService 가 기동 시 해석된 절대경로를 로그로 남긴다. 어긋나면 절대경로로 지정한다.
file.storage.local.base-dir=${FILE_LOCAL_BASE_DIR:../upload}
